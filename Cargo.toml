[workspace]
members = [
    "crates/adapter-entomologist",
    "crates/adapter-github",
    "crates/adapter-gitlab",
    "crates/adapter-mdtable",
    "crates/lattice-core",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonelay/lattice"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"

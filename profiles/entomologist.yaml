name: entomologist
profile_version: "1.0.0"

# Entomologist ("ent") issue register, read from the entomologist-data orphan
# branch of the target repo. No pathway: ent states are per-issue statuses with no
# register-wide current position, so there is nothing to bind one to.

node_kinds:
  issue:
    # Ent issue directories are 32-hex ids; the id is what a dependencies/
    # entry in another issue names.
    id_pattern: "^[0-9a-f]{32}$"
    summary_attr: summary
    # A flat issue tracker's issues mostly link to nothing; an edge is the
    # exception, not the health signal. `query orphans` still sees them.
    orphan_ok: true
    attrs:
      summary:  { type: string, required: true }
      author:   { type: string, required: true }
      # The vocabulary lives here, not in the adapter: a state ent adds later
      # is an ATTR_ENUM finding, never an adapter that rejects or rewrites it.
      state:
        type: enum
        required: true
        values: [new, backlog, blocked, inprogress, done, wontdo]
      assignee: { type: string }
      tags:     { type: list, items: string }
    # Owner actions for `latt browse` (c, s, a, t, e and the ! menu). Opt-in:
    # a profile with actions runs programs, so uncomment only in a profile you
    # trust. See docs/profiles.md, "actions".
    # actions:
    #   comment: { run: ["ent", "comment", "{id}"], mode: interactive }
    #   state:   { run: ["ent", "state", "{id}"], mode: interactive }
    #   assign:  { run: ["ent", "assign", "{id}"], mode: interactive }
    #   tag:     { run: ["ent", "tag", "{id}"], mode: capture }
    #   edit:    { run: ["ent", "edit", "{id}"], mode: interactive }
    #   show:    { run: ["ent", "show", "{id}"], mode: capture }

edge_kinds:
  depends_on:
    allowed:
      - [issue, issue]

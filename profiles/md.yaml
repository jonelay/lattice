name: md
profile_version: "1.0.0"

adapter:
  paths:
    files: ["*.md"]
  table:
    id_column: "ID"
    column_map:
      "Description": "summary"
      "Status": "status"
    edge_columns:
      "Traces To": "traces_to"

node_kinds:
  requirement:
    id_pattern: "^REQ-[0-9]+$"
    summary_attr: summary
    attrs:
      summary: { type: string, required: true }
      status: { type: string }

edge_kinds:
  traces_to:
    allowed:
      - [requirement, requirement]

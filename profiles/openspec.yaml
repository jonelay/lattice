name: openspec
profile_version: "1.5.0"

# An OpenSpec register: openspec/specs/<capability>/spec.md, cited from test
# files by `Requirement: <capability>/<title>` comment lines. Lattice's own register is the
# first consumer — see openspec/specs/adapter-openspec.

adapter:
  paths:
    spec_dir: "openspec/specs"
    # Each entry names where citing tests live and which comment dialect the
    # adapter reads them in. Paths are profile data: nothing in the adapter
    # hardcodes them.
    tests:
      - glob: "crates/latt-core/tests/*.rs"
        dialect: rust
      - glob: "crates/latt/tests/*.rs"
        dialect: rust
      - glob: "tests/*.py"
        dialect: python

node_kinds:
  capability:
    # One per spec directory; the ID is the directory name.
    id_pattern: "^[a-z0-9-]+$"

  requirement:
    # The ID is the capability, `/`, then the requirement title exactly as the
    # register writes it. The capability half has the capability kind's shape, so
    # a title containing `/` stays unambiguous; the title half only rejects
    # surrounding whitespace, not vocabulary.
    id_pattern: "^[a-z0-9-]+/\\S(.*\\S)?$"
    # The title doubles as the node ID, but the suggestion sidecar reads text
    # only through declared text attrs — an ID is identity, not ranked content.
    summary_attr: title
    # The sidecar ranks on the title and the body together: a title alone is
    # too short to match most tests against.
    text_attrs: [title, body]
    # Each scenario is ranked on its own and the best match kept, so a long
    # requirement's distinctive scenarios are not averaged away. The marker is
    # the register's, so the profile names it rather than the sidecar.
    text_chunk_line_prefix: "#### Scenario:"
    attrs:
      title:     { type: string, required: true }
      scenarios: { type: int, required: true }
      body:      { type: string }

  test:
    # Path, then `::` and the test's name: a Rust function, a Python function
    # with its optional class, or a TypeScript test's `describe` path and
    # free-text name. The name only rejects surrounding whitespace.
    id_pattern: "^[^:]+::\\S(.*\\S)?$"
    # An uncited test is not a finding on its own; coverage answers the
    # question from the requirement's side.
    orphan_ok: true
    summary_attr: function
    # The function name and its body: the body gives the requirement's prose
    # code to match against.
    text_attrs: [function, body]
    attrs:
      file:     { type: string, required: true }
      function: { type: string, required: true }
      body:     { type: string }

edge_kinds:
  contains:
    allowed:
      - [capability, requirement]
  verifies:
    allowed:
      - [test, requirement]

validations:
  # Visible on every run, contributes to no exit code — --strict never
  # promotes hint. Gating on coverage is a separate decision, deferred.
  # VACANCY keeps its shipped error severity: that set should be empty.
  - COVERAGE:
      target_kind: requirement
      edge_kind: verifies
      severity: hint

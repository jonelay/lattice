[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice-adapters"
version = "0.8.0"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/jonelay/lattice"
Issues = "https://github.com/jonelay/lattice/issues"
Changelog = "https://github.com/jonelay/lattice/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["jsonschema>=4.23", "pytest>=8.0", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["adapters"]

[tool.pytest.ini_options]
norecursedirs = [".claude", "target", "tests/fixtures/mini-toml", "tests/fixtures/mini-toml-directory", "tests/fixtures/mini-openspec", "tests/fixtures/mini-ent", "tests/fixtures/mini-md", "tests/fixtures/mini-md-multi", "tests/fixtures/mini-md-sources", "tests/fixtures/go-corpus", "tests/fixtures/mini-fuse", "tests/fixtures/mini-prose-xref", "tests/fixtures/mini-criterion", "tests/fixtures/ci-consumer"]

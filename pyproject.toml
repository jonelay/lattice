[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice-adapters"
version = "0.5.0"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/jonelay/lattice"
Issues = "https://github.com/jonelay/lattice/issues"
Changelog = "https://github.com/jonelay/lattice/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["adapters"]

[tool.pytest.ini_options]
norecursedirs = ["tests/fixtures/mini-repo", "tests/fixtures/mini-toml", "tests/fixtures/mini-openspec", "tests/fixtures/mini-ent", "tests/fixtures/mini-md", "tests/fixtures/mini-md-multi", "tests/fixtures/mini-github", "tests/fixtures/mini-gitlab", "tests/fixtures/mini-fuse"]

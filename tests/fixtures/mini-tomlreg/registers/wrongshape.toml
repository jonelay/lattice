# Fixture register whose fields are recognized but carry the wrong shape.
# Each one must be reported: skipping it quietly deletes an edge with no signal.

[register]
id = "reg.wrongshape"
register_version = 0
status = "draft-1"

[[item]]
id = "string_refs"
stage = "s1"
# A bare string, not a list: iterating it would yield one edge per character.
refs = "beta/two"

[[item]]
id = "numeric_register"
stage = "s1"
register = 7

name: test-rm-summary
profile_version: "1.0.0"

node_kinds:
  req:
    id_pattern: "^REQ-\\d{4}$"
    attrs:
      text:       { type: string, required: true }

  test:
    id_pattern: "^test_.*$"
    attrs:
      file: { type: string, required: true }

  spec-goal:
    id_pattern: "^\\d{2}-\\d+\\.\\d+$"
    attrs:
      title:  { type: string, required: true }
      status: { type: enum, values: [done, partial, todo, blocked], required: true }
      file:   { type: string, required: true }

edge_kinds:
  verifies:
    allowed:
      - [test, req]

validations:
  - SUMMARY:
      node_kind: spec-goal
      status_attr: status
      group_by_attr: file
